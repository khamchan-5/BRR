<!doctype html><html lang="lo"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Air Parts — ຮູບສິນຄ້າ</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f5f6f8;color:#17202a}header{padding:22px 5%;background:#111827;color:#fff}header h1{margin:0 0 6px}main{max-width:1250px;margin:auto;padding:22px 16px}.note{background:#fff4d6;border:1px solid #f1d58a;border-radius:10px;padding:12px 14px;margin-bottom:20px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filters button{border:1px solid #d1d5db;border-radius:20px;background:#fff;padding:9px 14px;cursor:pointer}.filters button.active{background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:15px}.card{background:white;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}.card img{display:block;width:100%;height:180px;object-fit:contain;background:#fff}.info{padding:12px}.code{font-size:12px;color:#64748b}.name{font-weight:700;margin:6px 0}.tag{font-size:12px;color:#475569}.price{margin-top:8px;font-weight:700;color:#9a3412}.qty{font-size:12px;color:#64748b;margin-top:4px}</style></head><body><header><h1>Air Parts</h1><p>ຕົວຢ່າງຮູບສິນຄ້າ 36 ລາຍການ</p></header><main><div class="note"><b>ໝາຍເຫດ:</b> ລາຄາ ແລະ ຈຳນວນຄົງເຫຼືອຍັງລໍຖ້າຢືນຢັນ. ໜ້ານີ້ໃຊ້ເບິ່ງຮູບສິນຄ້າໃນ ZIP ເທົ່ານັ້ນ.</div><div class="filters"><button class="active" data-filter="all">ທັງໝົດ (36)</button><button data-filter="air_compressor">ຄອມເພຣສເຊີ (10)</button><button data-filter="air_conditioning_parts">ອາໄຫຼ່ອື່ນໆ (26)</button></div><div id="grid" class="grid"></div></main><script>fetch('./data/product-import-template.json').then(r=>r.json()).then(items=>{const grid=document.getElementById('grid');function draw(filter='all'){grid.innerHTML='';items.filter(p=>filter==='all'||p.category===filter).forEach(p=>{const c=document.createElement('article');c.className='card';const im=document.createElement('img');im.src=p.imageUrl;im.alt=p.name;im.loading='lazy';const i=document.createElement('div');i.className='info';i.innerHTML='<div class="code"></div><div class="name"></div><div class="tag"></div><div class="price">ລໍຖ້າກຳນົດລາຄາ</div><div class="qty">ຈຳນວນ: ລໍຖ້າຢືນຢັນ</div>';i.querySelector('.code').textContent=p.code;i.querySelector('.name').textContent=p.name;i.querySelector('.tag').textContent=p.category==='air_compressor'?'ຄອມເພຣສເຊີແອ':'ອາໄຫຼ່ລະບົບແອ';c.append(im,i);grid.append(c)})}draw();document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(b.dataset.filter)})})</script></body></html>
